name: Setup Biome
author: biomejs
description: Setup the Biome CLI in GitHub Actions
branding:
  color: blue
  icon: terminal
inputs:
  token:
    description: GitHub Actions token to authenticate API requests
    required: true
    default: ${{ github.token }}
  version:
    description: The version of the Biome CLI to install
    required: true
    default: ""
  working-dir:
    description: The directory in which the action will look for lockfiles to extract the Biome version from
    required: false
    default: ""
  verify-digest:
    description: Verify the downloaded Biome CLI against the release asset digest. Set to `false` to skip verification.
    required: false
    default: true
runs:
  using: "node24"
  main: "dist/index.mjs"
